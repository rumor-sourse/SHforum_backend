# yaml 配置
version: "3.8"
services:
  mysql:
    image: "mysql:8.0.26"
    ports:
      - "3306:3306"
    command: "--default-authentication-plugin=mysql_native_password --init-file /data/application/init.sql"
    environment:
      MYSQL_ROOT_PASSWORD: "wszjdfs123456"
      MYSQL_DATABASE: "shforum"
      MYSQL_PASSWORD: "wszjdfs123456"
    volumes:
      - ./init.sql:/data/application/init.sql
  redis:
    image: "redis:5.0.7"
    ports:
      - "6379:6379"
  rabbitmq:
    image: "rabbitmq:3.9.14"
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "wck"
      RABBITMQ_DEFAULT_PASS: "123456"
      RABBITMQ_DEFAULT_VHOST: "shforum"
  elasticsearch:
    image: "elasticsearch:7.17.15"
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: "single-node"
  shforum_app:
    build: .
    ports:
      - "8090:8088"
    depends_on:
      - mysql
      - redis
      - elasticsearch
      - rabbitmq

