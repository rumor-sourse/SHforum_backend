# shforum
kind: Deployment
apiVersion: apps/v1
metadata:
  name: shforum-service
  labels:
    k8s-app: shforum-service
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: shforum-service
  template:
    metadata:
      name: shforum-service
      labels:
        k8s-app: shforum-service
    spec:
      containers:
        - name: shforum-service
          image: hackerwang/shforum:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: "NODE_ID"
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: "NODE_NAMESPACE"
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: "EXPOSE_IP"
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    name: shforum-service
  name: shforum-service
spec:
  ports:
    - port: 8088
  selector:
    k8s-app: shforum-service
